<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#C8321C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Storage Control" />
    <meta name="description" content="Control de inventario de la bodega de obras de arte de Ramos Delivery." />
    <title>Storage Control — Bodega Ramos</title>
    <script>
      // Aplica el tema guardado antes de pintar nada, para que no haya parpadeo claro→oscuro.
      try {
        var t = localStorage.getItem('storage-control-tema');
        if (t === 'Claro') document.documentElement.setAttribute('data-theme', 'light');
        if (t === 'Oscuro') document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
